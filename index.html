<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Globle Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ea; --panel: #ffffff; --panel2: #f8f6f1; --ink: #1d2433; --muted: #5f6673; --line: #e4dfd3;
    --accent: #e4572e; --accent-dark: #c2401b; --green: #2f9e58; --purple: #7c3aed; --gold: #ffd56b;
    --navy: #0e1738; --navy2: #070b1d; --tvmuted: #b7c3ef;
    --a0: #c2401b; --a1: #2f6fb0; --a2: #f2b632; --a3: #237a43;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { font-family: Nunito, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  body.tvmode { background: radial-gradient(ellipse at 50% -10%, #2c46a0 0%, var(--navy) 60%, var(--navy2) 100%); background-attachment: fixed; color: #fff; overflow: hidden; }
  h1, h2, h3, .fred { font-family: Fredoka, Nunito, sans-serif; }
  button { font-family: inherit; cursor: pointer; }
  .view { display: none; }
  .view.on { display: block; }
  .sub { display: none; }
  .sub.on { display: flex; }
  .hidden { display: none !important; }

  /* ---------- shared bits ---------- */
  .btn { display: block; width: 100%; border: none; border-radius: 14px; padding: 15px; font-size: 1.05rem; font-weight: 800; background: var(--accent); color: #fff; box-shadow: 0 4px 0 var(--accent-dark); }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--accent-dark); }
  .btn:disabled { opacity: 0.45; }
  .btn.ghost { background: var(--panel); color: var(--ink); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); }
  .btn.gold { background: linear-gradient(180deg, #ffd56b, #e0a92c); color: #231300; box-shadow: 0 4px 0 #9a6f12; }
  .btn.small { padding: 10px 14px; font-size: 0.92rem; width: auto; display: inline-block; }
  .lbl { font-size: 0.75rem; font-weight: 800; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin: 16px 0 7px; }
  .seg { display: flex; gap: 4px; background: #ebe6da; border-radius: 12px; padding: 4px; }
  .seg button { flex: 1; border: none; border-radius: 9px; padding: 10px 4px; background: transparent; font-weight: 700; color: #4b5563; font-size: 0.92rem; }
  .seg button.sel { background: var(--panel); color: var(--ink); font-weight: 800; box-shadow: 0 1px 4px rgba(0,0,0,0.12); }
  .tvmode .seg { background: rgba(255,255,255,0.1); }
  .tvmode .seg button { color: var(--tvmuted); }
  .tvmode .seg button.sel { background: var(--gold); color: #231300; }
  .av { border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; line-height: 1; }
  .toast { position: fixed; left: 50%; top: 14px; transform: translate(-50%, -10px); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 20px; font-weight: 800; font-size: 0.9rem; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 300; max-width: 92vw; text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  #fx { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 250; }
  @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }

  /* ---------- home / join (phone style) ---------- */
  .wrap { max-width: 480px; margin: 0 auto; padding: 22px 18px 40px; }
  .brand { font-family: Fredoka, sans-serif; font-size: 2.4rem; font-weight: 700; text-align: center; margin: 6px 0 2px; }
  .brand span { color: var(--accent); }
  .tagline { text-align: center; color: var(--muted); margin: 0 0 22px; }
  .bigchoice { display: flex; gap: 14px; align-items: center; text-align: left; width: 100%; background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 12px; color: var(--ink); }
  .bigchoice .ic { width: 52px; height: 52px; border-radius: 14px; background: #fff1ec; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .bigchoice b { display: block; font-size: 1.1rem; }
  .bigchoice span { font-size: 0.86rem; color: var(--muted); }
  .bigchoice:active { border-color: var(--accent); }
  input.text { width: 100%; font-size: 1.1rem; padding: 14px; border-radius: 14px; border: 2px solid var(--line); background: #fff; color: var(--ink); font-family: inherit; outline: none; }
  input.text:focus { border-color: var(--accent); }
  input.code { font-family: Fredoka, sans-serif; font-size: 1.9rem; letter-spacing: 0.4em; text-align: center; text-transform: uppercase; }
  .emojis { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
  .emojis button { height: 44px; border-radius: 12px; border: 2px solid var(--line); background: #fff; font-size: 1.45rem; padding: 0; }
  .emojis button.sel { border-color: var(--accent); background: #fff1ec; transform: scale(1.06); }
  .colors { display: flex; gap: 8px; flex-wrap: wrap; }
  .colors button { width: 38px; height: 38px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px var(--line); }
  .colors button.sel { box-shadow: 0 0 0 3px var(--ink); }
  .preview { display: flex; align-items: center; gap: 12px; justify-content: center; margin: 20px 0 14px; font-weight: 800; font-size: 1.2rem; }
  .err { color: #b91c1c; font-weight: 700; text-align: center; min-height: 1.2em; margin-top: 8px; }
  .rejoin { background: #eef5fc; border: 2px solid #b6d2ee; border-radius: 16px; padding: 12px 14px; margin-bottom: 14px; display: flex; gap: 10px; align-items: center; }
  .rejoin div { flex: 1; font-size: 0.92rem; }
  .howto { display: block; text-align: center; color: var(--accent); font-weight: 800; text-decoration: none; margin-top: 6px; padding: 10px; }

  /* ---------- TV ---------- */
  #v-tv { height: 100vh; font-size: clamp(14px, 1.45vw, 30px); }
  .tvbar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 0.8em; padding: 1em 2em; z-index: 5; }
  .tvbar .t { font-family: Fredoka, sans-serif; font-weight: 700; font-size: 1.5em; }
  .tvbar .t span { color: var(--gold); }
  .tvbar .sp { flex: 1; }
  .tvbar .chip { background: rgba(255,255,255,0.12); border-radius: 30px; padding: 0.35em 0.9em; font-weight: 800; }
  .tvbtn { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.25); border-radius: 30px; padding: 0.45em 1em; font-weight: 800; font-size: 0.85em; }
  .tvscreen { position: absolute; inset: 0; padding: 5.2em 2.4em 2em; flex-direction: column; }

  /* TV lobby */
  .tvlobby { display: grid; grid-template-columns: 19em 1fr; gap: 2em; height: 100%; }
  .joincard { background: rgba(255,255,255,0.06); border: 2px solid rgba(231,198,107,0.5); border-radius: 1.2em; padding: 1.4em; display: flex; flex-direction: column; align-items: center; gap: 0.7em; text-align: center; }
  .joincard .url { font-weight: 800; font-size: 0.95em; word-break: break-all; }
  .qr { background: #fff; border-radius: 0.8em; padding: 0.6em; width: 10em; height: 10em; display: flex; align-items: center; justify-content: center; }
  .qr img, .qr canvas { width: 100% !important; height: 100% !important; }
  .roomcode { font-family: Fredoka, sans-serif; font-size: 4em; font-weight: 700; letter-spacing: 0.12em; color: var(--gold); line-height: 1; }
  .tvmuted { color: var(--tvmuted); font-weight: 700; }
  .lobbyright { display: flex; flex-direction: column; gap: 1em; min-height: 0; }
  .pgrid { display: grid; gap: 0.8em; align-content: start; overflow: hidden; }
  .pgrid[data-size="l"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .pgrid[data-size="m"] { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .pgrid[data-size="s"] { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .pgrid[data-size="t"] { grid-template-columns: minmax(0, 1fr); flex: 1 1 auto; min-height: 0; }

  /* ---------- TEAMS ---------- */
  .teamcols { display: grid; gap: 0.8em; min-height: 0; }
  .tcol { background: rgba(255,255,255,0.06); border-radius: 1em; border-top: 0.3em solid var(--tc); padding: 0.7em; display: flex; flex-direction: column; gap: 0.4em; min-width: 0; overflow: hidden; }
  .tcol h4 { margin: 0 0 0.2em; font-family: Fredoka, sans-serif; font-size: 1.15em; display: flex; justify-content: space-between; color: var(--tc); }
  .tchip { display: flex; align-items: center; gap: 0.5em; background: rgba(255,255,255,0.08); border-radius: 0.7em; padding: 0.3em 0.5em; font-weight: 800; border: none; color: #fff; text-align: left; font-size: 0.95em; min-width: 0; }
  .tchip:hover { background: rgba(255,255,255,0.18); }
  .tchip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tchip.off { opacity: 0.4; }
  .teamtools { display: flex; gap: 0.8em; align-items: center; margin-top: 0.6em; }
  .tug { width: min(52em, 100%); display: flex; flex-direction: column; gap: 0.8em; }
  .tugteams { display: flex; justify-content: space-between; align-items: flex-end; gap: 1em; }
  .tugteam { display: flex; flex-direction: column; gap: 0.1em; min-width: 0; }
  .tugteam .tn { font-family: Fredoka, sans-serif; font-size: 1.5em; font-weight: 700; }
  .tugteam .ts { font-family: Fredoka, sans-serif; font-size: 2.6em; font-weight: 700; line-height: 1; }
  .rope { position: relative; height: 4em; }
  .rope .line { position: absolute; left: 0; right: 0; top: 1.6em; height: 0.8em; border-radius: 0.4em; background: repeating-linear-gradient(115deg, #c79a5b 0 0.7em, #a77b3f 0.7em 1.4em); }
  .rope .mid { position: absolute; left: 50%; top: 0.3em; bottom: 0.3em; width: 0.2em; background: rgba(255,255,255,0.5); transform: translateX(-50%); }
  .rope .knot { position: absolute; top: 0.9em; width: 2.2em; height: 2.2em; border-radius: 50%; background: var(--gold); border: 0.25em solid #fff; box-sizing: border-box; transform: translateX(-50%); transition: left 1.8s cubic-bezier(.3,1.3,.4,1); }
  .tugcards { display: grid; gap: 1.2em; }
  .tcard { background: rgba(255,255,255,0.07); border: 0.15em solid var(--tc); border-radius: 1em; padding: 0.7em 1em; display: flex; flex-direction: column; gap: 0.35em; min-width: 0; }
  .tcard .row { display: flex; align-items: center; gap: 0.6em; font-weight: 800; }
  .tcard .row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tcard .row .sc { color: var(--tvmuted); }
  .race { width: min(52em, 100%); display: flex; flex-direction: column; gap: 0.9em; }
  .raceRow { display: flex; align-items: center; gap: 0.8em; }
  .raceRow .lab { width: 8em; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 1.3em; color: var(--tc); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .raceRow .track { flex: 1; height: 2.4em; background: rgba(255,255,255,0.08); border-radius: 1.2em; overflow: hidden; }
  .raceRow .fill { height: 100%; background: var(--tc); border-radius: 1.2em; transition: width 1.6s cubic-bezier(.3,1.2,.4,1); display: flex; align-items: center; justify-content: flex-end; padding-right: 0.5em; font-size: 1.3em; }
  .raceRow .sc { width: 4.2em; text-align: right; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 1.4em; }
  .teamnote { font-weight: 800; color: var(--gold); text-align: center; min-height: 1.3em; }
  .twin { display: flex; flex-direction: column; align-items: center; gap: 0.6em; padding: 1em 2em; border-radius: 1.4em; background: rgba(255,255,255,0.08); border: 0.2em solid var(--tc); opacity: 0; transform: scale(0.85); transition: opacity 0.6s, transform 0.6s cubic-bezier(.2,1.5,.4,1); max-width: 100%; }
  .twin.show { opacity: 1; transform: none; }
  .twin .ttl { font-family: Fredoka, sans-serif; font-size: 2.6em; font-weight: 700; color: var(--tc); text-align: center; line-height: 1.1; }
  .twin .members { display: flex; gap: 0.8em; flex-wrap: wrap; justify-content: center; }
  .tstand { display: flex; gap: 0.8em; flex-wrap: wrap; justify-content: center; opacity: 0; transition: opacity 0.6s; }
  .tstand > div { background: rgba(255,255,255,0.08); border-radius: 0.8em; padding: 0.45em 1em; font-weight: 800; }
  .mvp { font-size: 1.25em; font-weight: 800; color: var(--gold); text-align: center; opacity: 0; transition: opacity 0.6s; }
  .tpick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .tpick button { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 10px; text-align: left; font-weight: 800; color: var(--ink); font-size: 1rem; }
  .tpick button.sel { border-color: var(--tc); background: color-mix(in srgb, var(--tc) 16%, #fff); }
  .tpick button small { display: block; color: var(--muted); font-weight: 700; font-size: 0.78rem; margin-top: 2px; }
  .tbadge { display: inline-flex; align-items: center; gap: 3px; border-radius: 20px; padding: 1px 8px; font-size: 0.75rem; font-weight: 800; color: #1d2433; vertical-align: middle; }
  .teamline { background: rgba(0,0,0,0.2); border-radius: 14px; padding: 8px 14px; font-weight: 800; }
  .pcard { background: rgba(255,255,255,0.08); border-radius: 1em; padding: 0.8em; display: flex; align-items: center; gap: 0.7em; animation: popIn 0.4s cubic-bezier(.2,1.5,.4,1); min-width: 0; }
  .pcard .nm { font-weight: 800; font-size: 1.1em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pcard.off { opacity: 0.4; }
  .pgrid[data-size="xs"] { grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 0.5em; }
  .pgrid[data-size="xs"] .pcard { flex-direction: column; text-align: center; padding: 0.4em 0.2em; gap: 0.2em; }
  .pgrid[data-size="xs"] .pcard .nm { font-size: 0.75em; max-width: 100%; }
  .pgrid[data-size="s"] .pcard { flex-direction: column; text-align: center; padding: 0.6em 0.3em; gap: 0.3em; }
  .pgrid[data-size="s"] .pcard .nm { font-size: 0.85em; max-width: 100%; }
  .settings { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1em; background: rgba(255,255,255,0.05); border-radius: 1em; padding: 0.9em 1em; }
  .settings .lbl { color: var(--tvmuted); margin: 0 0 0.4em; font-size: 0.7em; }
  .settings .seg button { font-size: 0.8em; padding: 0.55em 0.2em; }

  /* TV count */
  .tvcount { align-items: center; justify-content: center; text-align: center; gap: 0.5em; }
  .tvcount .q { font-family: Fredoka, sans-serif; font-size: 2.6em; color: var(--gold); }
  .tvcount .n { font-family: Fredoka, sans-serif; font-size: 9em; font-weight: 700; line-height: 1; animation: pulse 1s ease-in-out infinite; }

  /* TV play (question + reveal) */
  .tvplay { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); grid-template-rows: minmax(0, 1fr); gap: 2em; height: 100%; align-items: stretch; }
  .tvplay .globewrap { align-self: center; width: min(100%, calc(100vh - 7.6em)); }
  .globewrap { position: relative; width: 100%; aspect-ratio: 1 / 1; max-height: 100%; margin: 0 auto; }
  .globewrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 1.2em; }
  .tvpanel { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1em; min-width: 0; min-height: 0; height: 100%; }
  /* reveal: three stacked regions that can never overlap */
  .rv { display: flex; flex-direction: column; width: 100%; height: 100%; gap: 0.8em; }
  .rvhead { flex: 0 0 auto; min-height: 3.4em; display: flex; align-items: center; justify-content: center; text-align: center; }
  .rvbody { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  .rvfoot { flex: 0 0 auto; }
  .qtitle { font-family: Fredoka, sans-serif; font-size: 1.6em; color: var(--gold); }
  .qprompt { font-size: 1.3em; font-weight: 800; }
  .ring { position: relative; width: 9.5em; height: 9.5em; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Fredoka, sans-serif; font-size: 3.6em; font-weight: 700; }
  .lockrow { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.6em; max-width: 100%; }
  .lockrow .who { display: flex; flex-direction: column; align-items: center; gap: 0.2em; opacity: 0.4; transition: opacity 0.3s, transform 0.3s; }
  .lockrow .who.in { opacity: 1; transform: scale(1.05); }
  .lockrow .who .av { border: 0.18em solid transparent; }
  .lockrow .who.in .av { border-color: var(--gold); }
  .lockrow .who span { font-size: 0.8em; font-weight: 800; max-width: 6em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* reveal */
  .suspense { font-family: Fredoka, sans-serif; font-size: 2.2em; text-align: center; }
  .answerhead { font-family: Fredoka, sans-serif; font-size: 2.4em; font-weight: 700; text-align: center; animation: popIn 0.5s cubic-bezier(.2,1.6,.4,1); }
  .answerhead span { color: #4ade80; }
  .bars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1em; width: 100%; height: 100%; max-height: 24em; align-items: stretch; }
  .bar { display: flex; flex-direction: column; align-items: center; gap: 0.35em; height: 100%; justify-content: flex-end; transition: opacity 0.5s; }
  .bar .stack { display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-end; gap: 0.2em; max-width: 100%; flex: 0 0 auto; max-height: 5em; overflow: hidden; }
  .bar .colwrap { flex: 1 1 auto; min-height: 1.5em; width: 100%; display: flex; align-items: flex-end; }
  .bar .cnt { font-family: Fredoka, sans-serif; font-size: 1.8em; font-weight: 700; flex: 0 0 auto; line-height: 1.1; }
  .bar .col { width: 100%; border-radius: 0.7em 0.7em 0 0; height: 4%; transition: height 0.9s cubic-bezier(.2,1.1,.4,1); }
  .bar .foot { flex: 0 0 auto; width: 100%; border-radius: 0 0 0.7em 0.7em; padding: 0.5em 0.2em; text-align: center; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 1.05em; display: flex; justify-content: center; align-items: center; gap: 0.35em; line-height: 1.1; }
  .bar.right .col { box-shadow: 0 0 0 0.25em #4ade80; }
  .bar.dim { opacity: 0.3; }
  .cards { display: flex; flex-wrap: wrap; gap: 0.8em; justify-content: center; align-content: center; width: 100%; max-height: 100%; overflow: hidden; }
  .acard { background: rgba(255,255,255,0.1); border: 0.15em solid rgba(255,255,255,0.2); border-radius: 1em; padding: 0.7em 1em; display: flex; flex-direction: column; align-items: center; gap: 0.4em; animation: rise 0.45s ease both; transition: opacity 0.5s, background 0.5s, border-color 0.5s; min-width: 8em; }
  .acard b { font-size: 1.15em; }
  .acard.right { background: rgba(47,158,88,0.45); border-color: #4ade80; }
  .acard.dim { opacity: 0.35; }
  .fastest { font-weight: 800; color: #4ade80; font-size: 1.05em; min-height: 1.3em; text-align: center; }

  /* leaderboard */
  .tvboard { align-items: center; }
  .boardtitle { font-family: Fredoka, sans-serif; font-size: 2.4em; margin-bottom: 0.5em; }
  .board { position: relative; width: min(46em, 100%); }
  .brow { position: absolute; left: 0; right: 0; height: 3.3em; display: flex; align-items: center; gap: 0.8em; background: rgba(255,255,255,0.09); border-radius: 0.9em; padding: 0 1em; transition: top 0.9s cubic-bezier(.3,1.2,.4,1); }
  .brow .rk { width: 1.6em; font-family: Fredoka, sans-serif; font-size: 1.4em; font-weight: 700; color: var(--gold); }
  .brow .nm { flex: 1; font-weight: 800; font-size: 1.2em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brow .sc { font-family: Fredoka, sans-serif; font-size: 1.35em; font-weight: 700; font-variant-numeric: tabular-nums; }
  .brow .delta { font-size: 0.85em; font-weight: 800; color: #4ade80; width: 4.5em; text-align: right; }
  .brow.first { background: rgba(255,213,107,0.22); }
  .callout { margin-top: 1em; font-size: 1.3em; font-weight: 800; color: var(--gold); min-height: 1.5em; text-align: center; animation: popIn 0.5s ease both; animation-delay: 1.4s; }

  /* podium */
  .tvpodium { align-items: center; justify-content: flex-start; padding-bottom: 0; }
  .podarea { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 1.2em; padding-top: 1.4em; overflow: hidden; }
  .podtitle { flex: 0 0 auto; font-family: Fredoka, sans-serif; font-size: 3em; font-weight: 700; text-align: center; min-height: 1.2em; line-height: 1.15; }

<!-- ===================== HOME ===================== -->
<div class="view on" id="v-home">

// three wrong options: two near neighbours plus one from the same continent
function makeOptions(t) {
  const near = C.filter(c => c.iso !== t).map(c => ({ iso: c.iso, d: distKm(c.iso, t) })).sort((a, b) => a.d - b.d).slice(0, 14);
  const picks = shuffle(near.slice()).slice(0, 2).map(x => x.iso);
  const cont = C[idxOf[t]].cont;
  const pool = shuffle(C.filter(c => c.iso !== t && !picks.includes(c.iso) && c.cont === cont).map(c => c.iso));
  picks.push(pool[0] || shuffle(C.filter(c => c.iso !== t && !picks.includes(c.iso)).map(c => c.iso))[0]);
  return shuffle([t, ...picks]);
}

async function createRoom(mode, profile) {

// ---------- room helpers ----------
const players = () => room.players || {};
const playerList = () => Object.entries(players()).map(([id, p]) => Object.assign({ id }, p)).sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
const ranked = () => playerList().sort((a, b) => (b.score || 0) - (a.score || 0) || (a.joinedAt || 0) - (b.joinedAt || 0));
const qData = q => (room.questions || [])[q];
const answersFor = q => (room.answers && room.answers[q]) || {};
const resultsFor = q => (room.results && room.results[q]) || {};
const totalQ = () => (room.questions || []).length || room.settings.rounds;
const sizeClass = n => n <= 6 ? "l" : n <= 8 || (n <= 12 && innerHeight >= 700) ? "m" : "s";
// ---------- teams ----------
const TEAMS = [
  { id: "t0", name: "Kangaroo", emoji: "🦘", color: "#ff8a5c" },
  { id: "t1", name: "Kiwi", emoji: "🥝", color: "#5cc8ff" },
  { id: "t2", name: "Toucan", emoji: "🦜", color: "#c084fc" },
  { id: "t3", name: "Penguin", emoji: "🐧", color: "#4ade80" }
];
const TEAM_BONUS = 100;
const teamsOn = () => !!(room && room.settings && (room.settings.teams || 0) >= 2);
const activeTeams = () => TEAMS.slice(0, (room.settings && room.settings.teams) || 0);
const teamById = id => TEAMS.find(t => t.id === id);
const teamMembers = id => playerList().filter(p => p.team === id);
const myTeam = () => { const me = players()[uid]; return me && teamsOn() ? activeTeams().find(t => t.id === me.team) : null; };
// standings: score = average of members' scores + team bonuses (computed by the brain each question)
function teamStandings() {
  return activeTeams().map(t => Object.assign({}, t, (room.teams && room.teams[t.id]) || {}, { members: teamMembers(t.id) }))
    .filter(t => t.members.length)
    .sort((a, b) => (b.score || 0) - (a.score || 0) || a.id.localeCompare(b.id));
}
const buzzMode = () => !!(room && room.settings && room.settings.game === "buzz");
const raceMode = () => !!(room && room.settings && room.settings.game === "race");
const gameName = () => buzzMode() ? "Buzzer Battle" : raceMode() ? "Hot & Cold Race" : "Quiz Show";
const qWord = () => raceMode() ? "Round" : "Question";
const startLabel = () => `Start ${gameName()}` + (teamsOn() ? ` · ${activeTeams().length} teams` : "");
const tbadge = t => t ? `<span class="tbadge" style="background:${t.color}">${t.emoji} ${esc(t.name)}</span>` : "";

// =====================================================================
// BRAIN (runs on the TV, or on the host's phone in no-TV mode)
// =====================================================================
let brainTimer = null, brainAction = null;
const finished = {};

const GAME_OPTS = {
  race: { rounds: [3, 5, 8, 10], timer: [120, 180, 300], defRounds: 5, defTimer: 180 },
  other: { rounds: [5, 10, 15, 20], timer: [10, 20, 30], defRounds: 10, defTimer: 20 }
};
function setSetting(k, v) {
  if (!isBrain || room.state.phase !== "lobby") return;
  if (k !== "game") return roomRef.child("settings/" + k).set(v);
  const o = GAME_OPTS[v === "race" ? "race" : "other"], st = room.settings, upd = { game: v };
  if (!o.rounds.includes(st.rounds)) upd.rounds = o.defRounds;
  if (!o.timer.includes(st.timer)) upd.timer = o.defTimer;
  roomRef.child("settings").update(upd);
}

// keep every player on one of the active teams (new joiners go to the smallest team)
function brainAssignTeams() {
  if (!isBrain || !teamsOn()) return;
  const ids = activeTeams().map(t => t.id), counts = {};
  ids.forEach(i => counts[i] = 0);
  const list = playerList(), upd = {};
  list.forEach(p => { if (ids.includes(p.team)) counts[p.team]++; });
  list.forEach(p => {
    if (ids.includes(p.team)) return;
    const t = ids.slice().sort((a, b) => counts[a] - counts[b])[0];
    counts[t]++; upd[`players/${p.id}/team`] = t;
  });
  if (Object.keys(upd).length) roomRef.update(upd);
}
function shuffleTeams() {
  if (!isBrain || !teamsOn() || room.state.phase !== "lobby") return;
  const ids = activeTeams().map(t => t.id), upd = {};
  shuffle(playerList()).forEach((p, i) => { upd[`players/${p.id}/team`] = ids[i % ids.length]; });
  roomRef.update(upd);
}
function hostMove(pid) {
  if (!isBrain || !teamsOn() || room.state.phase !== "lobby") return;
  const ids = activeTeams().map(t => t.id), p = players()[pid];
  roomRef.child(`players/${pid}/team`).set(ids[(ids.indexOf(p.team) + 1) % ids.length]);
}
function pickTeam(tid) {
  if (!room || room.state.phase !== "lobby") return;
  db.ref(`rooms/${code}/players/${uid}/team`).set(tid);
}

function brainStart() {
  if (!isBrain) return;
  const plist = playerList();
  if (!plist.length) return toast("Wait for at least one player to join");
  if (teamsOn() && activeTeams().some(t => !teamMembers(t.id).length)) return toast("Every team needs at least one player. Shuffle teams or use fewer teams");
  const n = room.settings.rounds;
  const isos = shuffle(C.map(c => c.iso)).slice(0, n);
  const questions = isos.map(iso => room.settings.answers === "choice" && !raceMode() ? { iso, options: makeOptions(iso) } : { iso });
  const upd = { ver: APP_VERSION, questions, answers: null, results: null, teams: null, state: { phase: "count", q: 0, until: serverNow() + COUNT_MS } };
  plist.forEach(p => { upd[`players/${p.id}/score`] = 0; upd[`players/${p.id}/streak`] = 0; upd[`players/${p.id}/rank`] = null; upd[`players/${p.id}/prevRank`] = null; upd[`players/${p.id}/lastPts`] = 0; upd[`players/${p.id}/bz`] = null; upd[`players/${p.id}/ba`] = null; upd[`players/${p.id}/rg`] = null; });
  for (const k in finished) delete finished[k];
  for (const k in seenBuzz) delete seenBuzz[k];
  roomRef.update(upd);
}

function onlineCount() { return playerList().filter(p => p.online !== false).length; }
function allAnswered(q) {
  const a = answersFor(q), on = playerList().filter(p => p.online !== false);
  return on.length > 0 && on.every(p => a[p.id]);
}

function brainSchedule() {
  clearTimeout(brainTimer); brainAction = null;
  if (!isBrain || !room || !room.state) return;
  const s = room.state, now = serverNow();
  let due = null, act = null;
  if (s.phase === "count") {
    due = s.until;
    act = () => {
      const t0 = serverNow(), T = room.settings.timer * 1000;
      roomRef.child("state").set(buzzMode() ? { phase: "buzz", q: s.q, o: 0, openAt: t0, end: t0 + T }
        : raceMode() ? { phase: "race", q: s.q, start: t0, cap: t0 + T, end: t0 + T }
        : { phase: "question", q: s.q, start: t0, end: t0 + T });
    };
  }
  else if (s.phase === "question") { due = allAnswered(s.q) ? now + 700 : s.end + 300; act = () => finishQuestion(s.q); }
  else if (s.phase === "buzz") {
    // wait a moment after the first buzz arrives so a slightly earlier buzz on a slower connection still wins
    const k = s.q + ":" + s.o;
    if (buzzCands(s).length) { if (!seenBuzz[k]) seenBuzz[k] = now; due = seenBuzz[k] + BUZZ_PICK_MS; act = pickBuzzer; }
    else { due = s.end + 300; act = () => finishBuzz(s.q, null); }
  }
  else if (s.phase === "answer") { due = baFor(s) ? now + 150 : s.ansEnd + 400; act = judgeBuzz; }
  else if (s.phase === "race") {
    const fin = raceFinishers(s);
    // the first finisher starts the 60-second countdown for everyone else
    if (fin.length && !s.first) {
      const first = Math.min(...fin.map(p => p.rg.done));
      roomRef.child("state").update({ first, end: Math.min(s.cap, first + RACE_AFTER_FIRST) });
    }
    const on = playerList().filter(p => p.online !== false);
    const allDone = on.length > 0 && on.every(p => raceOf(p, s.q).done);
    due = allDone ? now + 1500 : s.end + 300; act = () => finishRace(s.q);
  }
  else if (s.phase === "reveal") { due = s.at + (buzzMode() ? BZ_REVEAL_MS : raceMode() ? RACE_REVEAL_MS : REVEAL_MS); act = () => s.q + 1 < totalQ() ? roomRef.child("state").set({ phase: "board", q: s.q, at: serverNow() }) : roomRef.child("state").set({ phase: "podium", at: serverNow() }); }
  else if (s.phase === "board") { due = s.at + BOARD_MS; act = () => roomRef.child("state").set({ phase: "count", q: s.q + 1, until: serverNow() + COUNT_MS }); }
  const tvSkip = $("tvSkip"), phSkip = $("phSkip");
  const canSkip = !!act;
  if (tvSkip) tvSkip.classList.toggle("hidden", !(canSkip && role === "tv"));
  if (phSkip) phSkip.classList.toggle("hidden", !canSkip);
  if (!act) return;
  const skey = st => st.phase + ":" + st.q + ":" + (st.o == null ? "" : st.o);
  const key = skey(s);
  brainAction = () => { if (room && room.state && skey(room.state) === key) act(); };
  brainTimer = setTimeout(brainAction, Math.max(0, due - now));
}
function brainSkip() { if (brainAction) { clearTimeout(brainTimer); brainAction(); } }

function finishQuestion(q) {
  if (finished[q]) return; finished[q] = true;
  const s = room.state, qd = qData(q), ans = answersFor(q), T = room.settings.timer * 1000;
  const res = {};
  playerList().forEach(p => {
    const a = ans[p.id], ok = !!(a && a.a === qd.iso);
    const ms = a ? Math.max(0, (a.t || s.end) - s.start) : null;
    const streak = ok ? (p.streak || 0) + 1 : 0;
    const pts = ok ? Math.round(1000 - 500 * Math.min(1, ms / T)) + Math.min(500, (streak - 1) * 100) : 0;
    res[p.id] = { a: a ? a.a : null, ok, pts, ms, streak };
  });
  commitResults(q, res, { phase: "reveal", q, at: serverNow(), start: s.start }, true);
}

// write scores, ranks, team standings and the next state in one go
function commitResults(q, res, nextState, allowTeamBonus) {
  const upd = {}, plist = playerList();
  const newScore = {};
  plist.forEach(p => {
    const r = res[p.id] || { pts: 0, streak: 0 };
    newScore[p.id] = (p.score || 0) + r.pts;
    upd[`players/${p.id}/score`] = newScore[p.id];
    upd[`players/${p.id}/streak`] = r.streak || 0;
    upd[`players/${p.id}/lastPts`] = r.pts;
  });
  const order = plist.map(p => ({ id: p.id, sc: newScore[p.id], j: p.joinedAt || 0 })).sort((a, b) => b.sc - a.sc || a.j - b.j);
  order.forEach((x, i) => { upd[`players/${x.id}/prevRank`] = players()[x.id].rank || i + 1; upd[`players/${x.id}/rank`] = i + 1; });
  upd[`results/${q}`] = res;
  if (teamsOn()) {
    // team score = average of members' scores, plus a bonus each time every (connected) member is right
    const tl = activeTeams().map(t => {
      const mem = plist.filter(p => p.team === t.id);
      if (!mem.length) return null;
      const prev = (room.teams && room.teams[t.id]) || {};
      const onl = mem.filter(p => p.online !== false);
      const allRight = !!allowTeamBonus && onl.length > 0 && onl.every(p => res[p.id] && res[p.id].ok);
      const bonus = (prev.bonus || 0) + (allRight ? TEAM_BONUS : 0);
      const avg = Math.round(mem.reduce((a, p) => a + upd[`players/${p.id}/score`], 0) / mem.length);
      return { id: t.id, score: avg + bonus, prevScore: prev.score || 0, bonus, allRight, prevRank: prev.rank };
    }).filter(Boolean).sort((a, b) => b.score - a.score || a.id.localeCompare(b.id));
    tl.forEach((t, i) => { upd[`teams/${t.id}`] = { score: t.score, prevScore: t.prevScore, bonus: t.bonus, allRight: t.allRight, rank: i + 1, prevRank: t.prevRank || i + 1 }; });
  }
  upd.state = nextState;
  roomRef.update(upd);
}

// ---------- Hot & Cold Race ----------
// each player keeps their own race progress in players/{uid}/rg = { q, g: [guesses], n, best (km), done (time found) }
function raceOf(p, q) {
  const r = p && p.rg && p.rg.q === q ? p.rg : null;
  return { g: (r && r.g) || [], n: (r && r.n) || 0, best: r && r.best != null ? r.best : null, done: (r && r.done) || 0 };
}
const raceFinishers = s => playerList().filter(p => raceOf(p, s.q).done).sort((a, b) => a.rg.done - b.rg.done);
// live order: finishers by time, then closest guess, then fewest guesses
function raceStandings(q) {
  return playerList().map(p => Object.assign({ p }, raceOf(p, q))).sort((a, b) =>
    (a.done ? 0 : 1) - (b.done ? 0 : 1) || (a.done && b.done ? a.done - b.done : 0) ||
    (a.best == null ? 1e9 : a.best) - (b.best == null ? 1e9 : b.best) || a.n - b.n);
}
const placePts = i => Math.max(300, Math.round(1000 * Math.pow(0.8, i)));
// didn't find it: up to 200 for getting close (bordering = 200)
const closePts = best => best == null ? 0 : best === 0 ? 200 : Math.max(0, Math.round(200 * (1 - Math.log10(1 + best / 60) / Math.log10(1 + 15000 / 60))));
function finishRace(q) {
  if (finished[q]) return; finished[q] = true;
  const s = room.state, fin = raceFinishers(s).map(p => p.id), res = {};
  playerList().forEach(p => {
    const r = raceOf(p, q), place = fin.indexOf(p.id), ok = place >= 0;
    const pts = ok ? placePts(place) : closePts(r.best);
    res[p.id] = { a: "", ok, pts, ms: ok ? Math.max(0, r.done - s.start) : null, n: r.n, best: r.best, place: ok ? place + 1 : null, streak: ok ? (p.streak || 0) + 1 : 0 };
  });
  commitResults(q, res, { phase: "reveal", q, at: serverNow(), start: s.start }, true);
}

// ---------- Buzzer Battle (brain) ----------
const seenBuzz = {};
// players who have buzzed in the current opening and aren't locked out
function buzzCands(s) {
  const locked = s.locked || {};
  return playerList().filter(p => !locked[p.id] && p.bz && p.bz.q === s.q && p.bz.o === s.o && (p.bz.t || 0) >= s.openAt - 300);
}
function baFor(s) {
  const p = players()[s.who];
  return p && p.ba && p.ba.q === s.q && p.ba.o === s.o ? p.ba : null;
}
function pickBuzzer() {
  const s = room.state; if (s.phase !== "buzz") return;
  const c = buzzCands(s).sort((a, b) => a.bz.t - b.bz.t || (a.joinedAt || 0) - (b.joinedAt || 0));
  if (!c.length) return;
  const w = c[0], now = serverNow();
  roomRef.child("state").set({
    phase: "answer", q: s.q, o: s.o, openAt: s.openAt, end: s.end, who: w.id,
    rt: Math.max(0, w.bz.t - s.openAt), win: Math.max(1000, s.end - s.openAt),
    ast: now, ansEnd: now + (BUZZ_ANS[room.settings.answers] || 7000),
    locked: s.locked || null, wrong: s.wrong || null,
    next: c[1] ? { id: c[1].id, d: c[1].bz.t - w.bz.t } : null
  });
}
function judgeBuzz() {
  const s = room.state; if (s.phase !== "answer") return;
  const ba = baFor(s), qd = qData(s.q);
  if (ba && ba.a === qd.iso) return finishBuzz(s.q, { id: s.who, a: ba.a, ms: s.rt, win: s.win });
  const said = ba ? ba.a : "";
  const wrong = (s.wrong || []).filter(Boolean).concat([{ id: s.who, a: said }]);
  const locked = Object.assign({}, s.locked || {});
  locked[s.who] = true;
  // in team games a wrong answer locks out the whole team, so another team gets the steal
  const tm = teamsOn() ? (players()[s.who] || {}).team : null;
  if (tm) playerList().forEach(p => { if (p.team === tm) locked[p.id] = true; });
  const elig = playerList().filter(p => p.online !== false && !locked[p.id]);
  if (!elig.length) return finishBuzz(s.q, null, wrong);
  const openAt = serverNow() + STEAL_GAP;
  roomRef.child("state").set({ phase: "buzz", q: s.q, o: s.o + 1, openAt, end: openAt + STEAL_MS, locked, wrong, steal: { id: s.who, a: said } });
}
function finishBuzz(q, win, wrongList) {
  if (finished[q]) return; finished[q] = true;
  const wrong = (wrongList || room.state.wrong || []).filter(Boolean), wmap = {};
  wrong.forEach(w => { wmap[w.id] = w; });
  const res = {};
  playerList().forEach(p => {
    const isWin = !!(win && win.id === p.id), w = wmap[p.id];
    const streak = isWin ? (p.streak || 0) + 1 : 0;
    let pts = 0;
    if (isWin) pts = Math.round(1000 - 500 * Math.min(1, win.ms / win.win)) + Math.min(500, (streak - 1) * 100);
    else if (w) pts = -WRONG_PEN;
    res[p.id] = { a: isWin ? win.a : w ? (w.a || "") : "", ok: isWin, pts, ms: isWin ? win.ms : null, buzz: isWin || !!w, streak };
  });
  commitResults(q, res, { phase: "reveal", q, at: serverNow(), win: win ? win.id : null, wrong: wrong.length ? wrong : null }, false);
}

let raceSnap = null, raceFeed = [];
function raceTick(s) {

  if (!raceSnap || raceSnap.q !== s.q) { raceSnap = { q: s.q, p: cur }; raceFeed = []; return; }
  const fins = Object.keys(cur).filter(id => cur[id].done).sort((a, b) => cur[a].done - cur[b].done);
  Object.keys(cur).forEach(id => {
    const c = cur[id], pv = raceSnap.p[id] || { best: null, done: 0 }, p = players()[id];
    if (!p) return;
    const within = (r, km) => r.best != null && r.best <= km;
    let ev = null;
    if (c.done && !pv.done) ev = { kind: "found", text: `🎉 ${p.name} found it in ${c.n} guess${c.n === 1 ? "" : "es"} · ${ordinal(fins.indexOf(id) + 1)}` };

    else if (!c.done && within(c, 500) && !within(pv, 500)) ev = { kind: "warm", text: `♨️ ${p.name} is within 500 km` };
    else if (!c.done && within(c, 2000) && !within(pv, 2000)) ev = { kind: "warm", text: `🌡️ ${p.name} is getting warm` };

}

  if (entering) {
    rad.innerHTML = "";

      <div class="racetimer" id="rcTimer"><div class="t1" id="rcT1"></div><div class="t2" id="rcT2"></div></div>

      <div class="feed" id="rcFeed"></div>
      <div class="tvmuted" style="font-size:0.8em;margin-top:auto">Badges show the number of guesses. Avatars only move inwards (each player's closest guess). Everyone's guesses are shown when the round ends.</div>`;
    const step = () => {
      const st = room && room.state; if (!st || st.phase !== "race" || !$("rcT2")) return;
      $("rcTimer").classList.toggle("hurry", !!st.first);
      $("rcT1").textContent = st.first ? "SOMEONE FOUND IT! EVERYONE ELSE HAS" : "TIME LEFT IN THIS ROUND";

}
function raceGuessFills(q, onlyUid) {
  const qd = qData(q), fills = {};
  playerList().forEach(p => { if (onlyUid && p.id !== onlyUid) return; raceOf(p, q).g.forEach(iso => { if (iso !== qd.iso) fills[iso] = heat(distKm(iso, qd.iso)); }); });
  fills[qd.iso] = "#2f9e58";
  return fills;
}
function raceRowsHTML(q, res, maxRows) {
  const st = raceStandings(q);
  const rows = st.slice(0, maxRows).map((x, i) => {
    const r = res[x.p.id] || {};
    const dt = x.done ? `✅ ${ordinal(r.place || i + 1)} · ${x.n} guess${x.n === 1 ? "" : "es"} · ${mmss(r.ms || 0)}` : x.best == null ? "no guesses" : `closest ${fmtKm(x.best)}`;
    return `<div class="rrow ${x.done ? "ok" : ""}" style="animation-delay:${i * 0.12}s">${avatarEm(x.p, 1.7)}<span class="nm">${esc(x.p.name)}</span><span class="dt">${dt}</span><span class="pt">+${r.pts || 0}</span></div>`;
  }).join("");
  return rows + (st.length > maxRows ? `<div class="tvmuted" style="text-align:center;font-size:0.85em">+${st.length - maxRows} more</div>` : "");
}
function tvRaceReveal(s, entering) {

// ---------------- TV: Buzzer Battle ----------------
// spin to the country once per question (the buzz/answer/steal phases all share one globe trip)
function tourOnce(g, q) {
  const qd = qData(q); if (!qd) return;
  const k = code + ":" + q + ":" + qd.iso + ":" + (room.questions || []).map(x => x.iso).join("").slice(0, 24);
  if (g.__toured === k) return;
  g.__toured = k; g.resize(); g.show(qd.iso, false); g.tour(qd.iso);
}
const bigAv = (p, sz) => `<span class="av bzwho" style="width:${sz};height:${sz};background:${p.color}"><span style="font-size:calc(${sz} * 0.56)">${esc(p.emoji)}</span></span>`;
const saidTxt = a => a ? "said " + esc(nameOf(a)) : "ran out of time";
function tvBuzz(s, entering) {
  showSub("v-tv", "tvPlay");
  const g = ensureTvGlobe(), qd = qData(s.q);
  tourOnce(g, s.q);
  const list = playerList(), locked = s.locked || {}, panel = $("tvPanel");
  const em = list.length <= 6 ? 3 : list.length <= 12 ? 2.3 : 1.8;
  if (s.phase === "buzz") {
    if (entering) {
      const st = s.steal ? players()[s.steal.id] : null;
      panel.innerHTML = `<div class="qtitle">Question ${s.q + 1} of ${totalQ()}</div>
        <div class="bzhead" id="bzHead"></div>
        <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8"/><circle id="tvRingArc" cx="50" cy="50" r="44" fill="none" stroke="#ff6b6b" stroke-width="8" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><div class="num" id="tvRingNum"></div></div>
        <div class="lockrow" id="tvLock"></div>
        <div class="tvmuted" style="font-size:0.9em;text-align:center">${s.o ? (teamsOn() ? "Other teams can steal it" : "Everyone else can steal it") : `Know it? Buzz first, then ${qd.options ? "pick from 4 choices" : "type it"}. ${WRONG_PEN ? `Wrong answers cost ${WRONG_PEN}` : "Get it wrong and you're out for this one"}`}</div>`;
      const head = $("bzHead");
      const setOpen = () => { head.innerHTML = `<div class="buzzopen">${s.o ? "Steal! Buzz now" : "Buzzers open!"}</div>`; };
      if (st && serverNow() < s.openAt) { head.innerHTML = `<div class="stealmsg">❌ ${esc(st.name)} ${saidTxt(s.steal.a)}</div><div class="stealbig">STEAL!</div>`; later(setOpen, s.openAt - serverNow()); }
      else setOpen();
      const T = Math.max(1, s.end - s.openAt);
      const step = () => {
        const a = $("tvRingArc"), num = $("tvRingNum"); if (!a) return;
        const now = serverNow(), left = Math.max(0, Math.min(T, s.end - Math.max(now, s.openAt)));
        a.setAttribute("stroke-dashoffset", (276.5 * (1 - left / T)).toFixed(1));
        num.textContent = Math.ceil(left / 1000);
        if (s.end - now > 0) rafTimer = requestAnimationFrame(step);
      };
      step();
    }
    const sig = list.map(p => p.id + (locked[p.id] ? 1 : 0)).join();
    const row = $("tvLock");
    if (row && row.dataset.sig !== sig) { row.dataset.sig = sig; row.innerHTML = list.map(p => `<div class="who ${locked[p.id] ? "out" : "on"}">${avatarEm(p, em)}<span>${esc(p.name)}</span></div>`).join(""); }
    return;
  }
  // answer phase: someone won the buzz
  if (!entering) return;
  const w = players()[s.who] || { name: "?", emoji: "❓", color: "#555" };
  const wrong = (s.wrong || []).filter(Boolean), gone = wrong.map(x => x.a);
  const nx = s.next && players()[s.next.id];
  panel.innerHTML = `<div class="bzlabel">${s.o ? "STEAL ATTEMPT" : "BUZZED FIRST"} · ${(s.rt / 1000).toFixed(2)}s</div>
    ${bigAv(w, "min(5.6em, 19vh)")}
    <div class="bzname">${esc(w.name)} is answering<span class="dots"></span></div>
    ${nx ? `<div class="tvmuted" style="font-size:0.9em">Beat ${esc(nx.name)} by ${(Math.max(0, s.next.d) / 1000).toFixed(2)}s</div>` : ""}
    <div class="bzbar"><div id="bzBar"></div></div><div style="font-weight:800" id="bzLeft"></div>
    ${qd.options ? `<div class="bzopts">${qd.options.map((iso, k) => `<div class="${gone.includes(iso) ? "gone" : ""}" style="background:${OPT[k].bg};color:${OPT[k].fg}">${shapeSvg(k)}<span>${esc(nameOf(iso))}</span></div>`).join("")}</div>` : ""}
    ${wrong.length ? `<div class="outrow"><span class="tvmuted" style="font-size:0.85em">Locked out:</span>${wrong.map(x => { const p = players()[x.id]; return p ? `<span class="outchip">${avatarEm(p, 1.5)}${esc(p.name)} (${saidTxt(x.a)})</span>` : ""; }).join("")}</div>` : ""}`;
  const T = Math.max(1, s.ansEnd - s.ast);
  const step = () => {
    const bar = $("bzBar"), lf = $("bzLeft"); if (!bar) return;
    const left = Math.max(0, s.ansEnd - serverNow());
    bar.style.width = (100 * left / T) + "%";
    lf.textContent = left > 0 ? `${Math.ceil(left / 1000)} seconds left` : "Time's up!";
    if (left > 0) rafTimer = requestAnimationFrame(step);
  };
  step();
}
// team score changes for this question, e.g. "🥝 Kiwi +290 · 🦘 Kangaroo −62"

  if (!teamsOn()) return "";

    .map(x => `${x.t.emoji} ${esc(x.t.name)} ${x.d > 0 ? "+" : "−"}${Math.abs(x.d)}`).join("  ·  ");
}

function tvBoard() {
  showSub("v-tv", "tvBoard");
  const list = ranked(), top = list.slice(0, 8);
  // fit up to 8 rows in whatever height this screen has
  const fontPx = parseFloat(getComputedStyle($("v-tv")).fontSize) || 18;
  const availEm = innerHeight / fontPx - 14;
  const rowH = Math.max(2.2, Math.min(3.9, availEm / Math.max(1, top.length)));
  const el = $("tvBoard");
  el.innerHTML = `<div class="boardtitle">Leaderboard</div><div class="board" id="tvBoardRows" style="height:${top.length * rowH}em"></div><div class="callout" id="tvCallout"></div>`;
  const rows = $("tvBoardRows");
  top.forEach(p => {
    const prev = Math.min(p.prevRank || p.rank, 9);
    const d = document.createElement("div");
    d.className = "brow" + (p.rank === 1 ? " first" : "");
    d.style.height = ((rowH - 0.45) * fontPx) + "px";
    if (rowH < 3.2) d.style.fontSize = "0.82em";
    d.style.top = ((prev - 1) * rowH * fontPx) + "px";
    d.innerHTML = `<div class="rk">${p.rank}</div>${avatarEm(p, 2.4)}<div class="nm">${esc(p.name)}${p.streak >= 3 ? ` <span style="color:#ff9b73">🔥${p.streak}</span>` : ""}</div><div class="delta ${p.lastPts < 0 ? "neg" : ""}">${p.lastPts ? (p.lastPts > 0 ? "+" : "−") + Math.abs(p.lastPts) : ""}</div><div class="sc" data-to="${p.score || 0}" data-from="${(p.score || 0) - (p.lastPts || 0)}">${((p.score || 0) - (p.lastPts || 0)).toLocaleString()}</div>`;
    rows.appendChild(d);
    later(() => { d.style.top = ((p.rank - 1) * rowH * fontPx) + "px"; }, 700);
  });
  // count the scores up
  const t0 = performance.now() + 300;
  const step = now => {
    const t = Math.min(1, Math.max(0, (now - t0) / 900));
    rows.querySelectorAll(".sc").forEach(sc => { const a = +sc.dataset.from, b = +sc.dataset.to; sc.textContent = Math.round(a + (b - a) * t).toLocaleString(); });
    if (t < 1) rafTimer = requestAnimationFrame(step);
  };
  rafTimer = requestAnimationFrame(step);
  const climber = list.filter(p => p.prevRank && p.prevRank > p.rank).sort((a, b) => (b.prevRank - b.rank) - (a.prevRank - a.rank))[0];
  const hot = list.filter(p => p.streak >= 3).sort((a, b) => b.streak - a.streak)[0];
  $("tvCallout").textContent = climber ? `🚀 ${climber.name} climbed to ${ordinal(climber.rank)}!` : hot ? `🔥 ${hot.name} is on a ${hot.streak}-answer streak!` : list[0] ? `👑 ${list[0].name} leads the pack` : "";
}

function teamCard(t, maxRows) {
  const mem = t.members.slice().sort((a, b) => (b.score || 0) - (a.score || 0));
  return `<div class="tcard" style="--tc:${t.color}">${mem.slice(0, maxRows).map(p => `<div class="row">${avatarEm(p, 1.8)}<span class="nm">${esc(p.name)}</span><span class="sc">${(p.score || 0).toLocaleString()}</span></div>`).join("")}
    ${mem.length > maxRows ? `<div class="tvmuted" style="font-size:0.85em">+${mem.length - maxRows} more</div>` : ""}${t.bonus ? `<div class="tvmuted" style="font-size:0.85em">Team bonuses +${t.bonus}</div>` : ""}</div>`;
}
function countUp(el) {
  const t0 = performance.now() + 300;
  const step = now => {
    const t = Math.min(1, Math.max(0, (now - t0) / 1200));
    el.querySelectorAll("[data-to]").forEach(x => { const a = +x.dataset.from, b = +x.dataset.to; x.textContent = Math.round(a + (b - a) * t).toLocaleString(); });
    if (t < 1) rafTimer = requestAnimationFrame(step);
  };
  rafTimer = requestAnimationFrame(step);
}

      ${qd.options ? `<div class="opts ${noTV ? "compact" : ""}">${qd.options.map((iso, k) => `<button class="opt" ${gone.includes(iso) ? "disabled" : ""} style="background:${OPT[k].bg};color:${OPT[k].fg}" onclick="sendBuzzAnswer('${iso}')">${shapeSvg(k)}<span>${esc(nameOf(iso))}</span></button>`).join("")}</div>`
        : `<div class="picker"><div class="prow"><input class="text" id="bzIn" placeholder="Type or pick a country…" autocomplete="off" autocorrect="off" spellcheck="false"><button class="btn small" onclick="bzPicker.enter()">Answer</button></div><div class="suggest" id="bzSug"></div></div>`}`;
    if (!qd.options) { bzPicker = makePicker($("bzIn"), $("bzSug"), sendBuzzAnswer); setTimeout(() => { const i = $("bzIn"); if (i) i.focus(); }, 60); }
    if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
    countdown(s.ansEnd, "bzLeft", "⏱ ");
  } else if (st === "sent") {
    const ba = baFor(s);
    area.innerHTML = `<div class="bzbig">Locked in!</div><div style="font-weight:700;color:#f3b6b6">You said <b style="color:#fff">${esc(nameOf(ba && ba.a))}</b></div><div style="font-size:3rem">🤞</div>`;
  } else { // watch
    const w = players()[s.who] || { name: "?", emoji: "❓", color: "#555" };
    const beat = mineBz && me.bz && me.bz.t ? Math.max(0, me.bz.t - (s.openAt + s.rt)) : null;
    area.innerHTML = `${avatar(w, 96)}<div class="bzbig">${esc(w.name)} buzzed first</div>
      <div style="font-weight:700;color:#f3b6b6">${beat !== null ? `So close! Beaten by ${(beat / 1000).toFixed(2)}s` : "They're answering now"}</div>
      <div class="bzpill" id="bzLeft"></div>`;
    countdown(s.ansEnd, "bzLeft", "⏱ ");
  }
}
function phBuzzReveal(s, noTV) {
  showSub("v-ph", "phReveal");
  const qd = qData(s.q), all = resultsFor(s.q), res = all[uid] || { ok: false, pts: 0 }, me = players()[uid];
  const w = s.win ? players()[s.win] : null;
  const cls = res.ok ? "ok" : res.buzz ? "no" : "none";
  const head = res.ok ? "You got it!" : res.buzz ? "Not quite" : w ? `${esc(w.name)} got it` : "Nobody got it";
  const above = ranked().find(p => p.rank === (me.rank || 1) - 1);
  const rankLine = me.rank === 1 ? (ranked()[1] ? `Leading by ${((me.score || 0) - (ranked()[1].score || 0)).toLocaleString()}` : "Leading") : above ? `${((above.score || 0) - (me.score || 0)).toLocaleString()} behind ${esc(above.name)}` : "";
  let body;
  if (res.ok) body = `<div class="pts">+${res.pts}</div><div style="font-weight:700">Buzzed in ${((res.ms || 0) / 1000).toFixed(2)}s</div>${me.streak >= 2 ? `<div class="streak">🔥 ${me.streak} in a row · +${Math.min(500, (me.streak - 1) * 100)} bonus</div>` : ""}`;
  else body = `<div style="font-size:1.2rem;font-weight:700">It was <b>${esc(nameOf(qd.iso))}</b>${res.buzz ? `<br><span style="opacity:0.85">You ${saidTxt(res.a)}</span>` : ""}</div>
    ${res.pts < 0 ? `<div class="pts" style="color:#fff">−${Math.abs(res.pts)}</div>` : w ? `<div style="display:flex;align-items:center;gap:8px;font-weight:800">${avatar(w, 34)} +${(all[s.win] || {}).pts || 0}</div>` : ""}`;
  const tl = teamsOn() && myTeam() ? (() => { const t = myTeam(), info = (room.teams || {})[t.id] || {}; return `<div class="teamline">${t.emoji} Team ${esc(t.name)} is ${ordinal(info.rank || 1)} · ${(info.score || 0).toLocaleString()} pts</div>`; })() : "";
  let mini = "";
  if (noTV) mini = `<div class="mini">${playerList().filter(p => all[p.id] && all[p.id].buzz).map(p => `<div><span>${esc(p.emoji)} ${esc(p.name)}</span><span>${all[p.id].ok ? "✅ +" + all[p.id].pts : "❌ " + (all[p.id].a ? esc(nameOf(all[p.id].a)) : "no answer")}</span></div>`).join("") || "<div><span>Nobody buzzed in</span></div>"}</div>`;
  $("phReveal").innerHTML = `${noTV ? `<div class="globewrap phglobe" id="phRevGlobe" style="width:min(100%,30vh)"></div>` : ""}<div class="resultfull ${cls}" style="${noTV ? "min-height:0" : ""}">
    <div class="head">${head}</div>${body}${tl}
    <div class="rank"><span style="color:var(--muted);font-weight:700">You're in</span><b>${ordinal(me.rank || 1)} place</b><span style="font-weight:700">${rankLine}</span></div>
    ${mini}</div>`;
  if (noTV) { const g = makeGlobe($("phRevGlobe")); setTimeout(() => { g.resize(); g.show(qd.iso, true); g.goTo(qd.iso); }, 30); }
  if (navigator.vibrate) navigator.vibrate(res.ok ? [40, 60, 40] : res.buzz ? 200 : 20);
  if (res.ok) miniBurst(innerWidth / 2, innerHeight * 0.35);
}

function phReveal(s, noTV) {
  const qd = qData(s.q), res = resultsFor(s.q)[uid] || { ok: false, pts: 0, a: null }, me = players()[uid];
  const elapsed = serverNow() - s.at;
  showSub("v-ph", "phReveal");
  $("phReveal").innerHTML = noTV
    ? `<div class="globewrap phglobe" id="phRevGlobe"></div><div class="fred" style="font-size:1.6rem;font-weight:700">Everyone's locked in<span class="dots"></span></div><div style="font-size:3rem">🥁</div>`
    : `<div style="font-size:4rem;animation:pulse 0.6s infinite">🥁</div><div class="fred" style="font-size:1.8rem;font-weight:700">Drumroll<span class="dots"></span></div><div style="color:var(--muted);font-weight:700">Watch the big screen!</div>`;
  if (noTV) {

  }
  later(() => {
    const cls = res.ok ? "ok" : res.a ? "no" : "none";
    const head = res.ok ? "Correct!" : res.a ? "Not quite" : "Time's up!";
    const above = ranked().find(p => p.rank === (me.rank || 1) - 1);
    const rankLine = me.rank === 1 ? (ranked()[1] ? `Leading by ${((me.score || 0) - (ranked()[1].score || 0)).toLocaleString()}` : "Leading") : above ? `${((above.score || 0) - (me.score || 0)).toLocaleString()} behind ${esc(above.name)}` : "";
    let mini = "";
    if (noTV) {
      const list = playerList(), all = resultsFor(s.q);
      mini = `<div class="mini">${list.map(p => `<div><span>${esc(p.emoji)} ${esc(p.name)}</span><span>${all[p.id] && all[p.id].ok ? "✅ +" + all[p.id].pts : all[p.id] && all[p.id].a ? "❌ " + esc(nameOf(all[p.id].a)) : "⏳"}</span></div>`).join("")}</div>`;
    }
    $("phReveal").innerHTML = `<div class="resultfull ${cls}">
      <div class="head">${head}</div>
      ${res.ok ? `<div class="pts">+${res.pts}</div><div style="font-weight:700">Answered in ${(res.ms / 1000).toFixed(1)}s</div>${me.streak >= 2 ? `<div class="streak">🔥 ${me.streak} in a row${me.streak >= 2 ? ` · +${Math.min(500, (me.streak - 1) * 100)} bonus` : ""}</div>` : ""}`
        : `<div style="font-size:1.2rem;font-weight:700">It was <b>${esc(nameOf(qd.iso))}</b>${res.a ? `<br><span style="opacity:0.85">You said ${esc(nameOf(res.a))}</span>` : ""}</div>`}
      ${teamLine(s.q)}
      <div class="rank"><span style="color:var(--muted);font-weight:700">You're in</span><b>${ordinal(me.rank || 1)} place</b><span style="font-weight:700">${rankLine}</span></div>
      ${mini}</div>`;
    if (navigator.vibrate) navigator.vibrate(res.ok ? [40, 60, 40] : 200);
    if (res.ok) miniBurst(innerWidth / 2, innerHeight * 0.35);
  }, CORRECT_AT - elapsed);
}

function teamLine(q) {
  const t = myTeam(); if (!t) return "";
  const mem = teamMembers(t.id), all = resultsFor(q), right = mem.filter(p => all[p.id] && all[p.id].ok).length;
  const info = (room.teams && room.teams[t.id]) || {};
  return `<div class="teamline">${t.emoji} Team ${esc(t.name)}: ${right}/${mem.length} correct${info.allRight ? ` · +${TEAM_BONUS} team bonus!` : ""}<br><span style="opacity:0.85">Team is ${ordinal(info.rank || 1)} · ${(info.score || 0).toLocaleString()} pts</span></div>`;
}
function phTeamList() {
  const mine = myTeam();
  return `<div class="lb">${teamStandings().map((t, i) => `<div class="r ${mine && t.id === mine.id ? "me" : ""}"><span class="k">${i + 1}</span><span style="font-size:1.3rem">${t.emoji}</span><span class="n">Team ${esc(t.name)}</span><span>${(t.score || 0).toLocaleString()}</span></div>`).join("")}</div>`;
}
function phBoard(noTV) {
  if (teamsOn()) return phTeamBoard();
  showSub("v-ph", "phBoard");
  const me = players()[uid], list = ranked();
  const moved = me.prevRank && me.prevRank !== me.rank ? (me.prevRank > me.rank ? `⬆️ Up ${me.prevRank - me.rank} from ${ordinal(me.prevRank)}` : `⬇️ Down from ${ordinal(me.prevRank)}`) : "";
  $("phBoard").innerHTML = `<div class="card" style="text-align:center;animation:popIn 0.4s ease"><div style="color:var(--muted);font-weight:800">You're</div><div class="place">${ordinal(me.rank || 1)}</div><div style="font-weight:800">${(me.score || 0).toLocaleString()} pts</div><div style="font-weight:700;color:var(--green)">${moved}</div></div>
    ${noTV || list.length > 1 ? `<div class="lbl">Leaderboard</div><div class="lb">${list.slice(0, noTV ? 8 : 5).map(p => `<div class="r ${p.id === uid ? "me" : ""}"><span class="k">${p.rank}</span>${avatar(p, 30)}<span class="n">${esc(p.name)}</span><span>${(p.score || 0).toLocaleString()}</span></div>`).join("")}</div>` : ""}`;
}

function phTeamBoard() {
  showSub("v-ph", "phBoard");
  const me = players()[uid], t = myTeam(), info = (t && room.teams && room.teams[t.id]) || {};
  const mates = t ? teamMembers(t.id).sort((a, b) => (b.score || 0) - (a.score || 0)) : [];
  $("phBoard").innerHTML = `<div class="card" style="text-align:center;animation:popIn 0.4s ease;border:2px solid ${t ? t.color : "var(--line)"}">
      <div style="color:var(--muted);font-weight:800">${t ? `${t.emoji} Team ${esc(t.name)} is` : "Your team is"}</div><div class="place">${ordinal(info.rank || 1)}</div>
      <div style="font-weight:800">${(info.score || 0).toLocaleString()} team pts</div>
      <div style="font-weight:700;color:var(--muted)">You: ${(me.score || 0).toLocaleString()} pts · ${ordinal(mates.findIndex(p => p.id === uid) + 1)} on your team</div></div>
    <div class="lbl">Teams</div>${phTeamList()}`;

function phTeamPodium() {
  showSub("v-ph", "phPodium");
  const me = players()[uid], st = teamStandings(), t = myTeam();
  const place = t ? st.findIndex(x => x.id === t.id) + 1 : 0;
  const win = st[0], tie = st[1] && (st[1].score || 0) === (win.score || 0);

  $("phPodium").innerHTML = `<div style="font-size:4rem">${myWin ? "🏆" : "🎉"}</div>
    <div class="fred" style="font-size:1.8rem;font-weight:700">${tie ? "It's a tie!" : `${win.emoji} Team ${esc(win.name)} wins!`}</div>
    ${t ? `<div style="font-weight:800;color:var(--muted)">Your team finished ${ordinal(place)}</div>` : ""}
    ${phTeamList()}
    <div class="card" style="width:100%;max-width:360px;text-align:center"><b>You</b>: ${(me.score || 0).toLocaleString()} pts · ${ordinal(me.rank || 1)} overall${mvp ? `<br>⭐ MVP: ${esc(mvp.name)} · ${(mvp.score || 0).toLocaleString()}` : ""}</div>
    ${isBrain ? `<button class="btn" onclick="backToLobby()">Play again</button>` : `<div style="color:var(--muted);font-weight:700">Waiting for the host…</div>`}`;
  if (myWin) later(celebrate, 600);
}
function phPodium() {
  if (teamsOn()) return phTeamPodium();
  showSub("v-ph", "phPodium");
  const me = players()[uid], list = ranked();
  const medal = ["🥇", "🥈", "🥉"][me.rank - 1] || "🎉";
  const res = room.results || {};
  let right = 0, fastest = null;
  Object.values(res).forEach(r => { const x = r[uid]; if (x && x.ok) { right++; if (fastest === null || x.ms < fastest) fastest = x.ms; } });
  $("phPodium").innerHTML = `<div style="font-size:4rem">${medal}</div><div class="fred" style="font-size:1.4rem;color:var(--muted)">You finished</div><div class="place">${ordinal(me.rank || 1)}</div>
    <div style="font-weight:800">${(me.score || 0).toLocaleString()} pts · ${raceMode() ? `found ${right}/${totalQ()}` : `${right}/${totalQ()} correct`}${fastest !== null ? ` · fastest ${raceMode() ? mmss(fastest) : (fastest / 1000).toFixed(1) + "s"}` : ""}</div>
    <div class="lb" style="max-width:360px">${list.slice(0, 5).map(p => `<div class="r ${p.id === uid ? "me" : ""}"><span class="k">${p.rank}</span>${avatar(p, 30)}<span class="n">${esc(p.name)}</span><span>${(p.score || 0).toLocaleString()}</span></div>`).join("")}</div>
    ${isBrain ? `<button class="btn" onclick="backToLobby()">Play again</button>` : `<div style="color:var(--muted);font-weight:700">Waiting for the host…</div>`}`;
  if (me.rank === 1) later(celebrate, 600);
}

// =====================================================================
// CONFETTI & SPARKS
// =====================================================================
const fxC = $("fx"), fx = fxC.getContext("2d");
let fxW = 0, fxH = 0, parts = [], fxOn = false, fxLast = 0;
function fxResize() { fxW = innerWidth; fxH = innerHeight; fxC.width = fxW; fxC.height = fxH; }
fxResize(); addEventListener("resize", () => { fxResize(); if (tvGlobe) tvGlobe.resize(); if (phGlobe) phGlobe.resize(); });
const rand = (a, b) => a + Math.random() * (b - a), pickOne = a => a[Math.floor(Math.random() * a.length)];
const PAL = ["#e4572e", "#f9a95a", "#ffd23f", "#2f9e58", "#3fa7d6", "#7b5ea7", "#ff7aa2"];
function fxAdd(p) { if (parts.length >= 260) return; p.life = 0; parts.push(p); if (!fxOn) { fxOn = true; fxLast = performance.now(); requestAnimationFrame(fxLoop); } }
function fxLoop(now) {
  const dt = Math.min(0.05, (now - fxLast) / 1000); fxLast = now;
  fx.setTransform(1, 0, 0, 1, 0, 0); fx.clearRect(0, 0, fxW, fxH);
  let w = 0;
  for (const p of parts) {
    p.life += dt; if (p.life >= p.max) continue;
    const k = 1 - p.drag * dt; p.vx *= k; p.vy *= k; p.vy += p.g * dt;
    p.x += p.vx * dt + (p.sway ? Math.sin(p.life * p.swayF + p.phase) * p.sway * dt : 0); p.y += p.vy * dt;
    if (p.y > fxH + 30 && p.vy > 0) continue;
    const t = p.life / p.max;
    fx.globalAlpha = t > 0.8 ? (1 - t) * 5 : 1; fx.fillStyle = p.color;
    if (p.kind === 0) { p.rot += p.vr * dt; const c = Math.cos(p.rot), s = Math.sin(p.rot), f = Math.cos(p.life * p.flipF + p.phase); fx.setTransform(c, s, -s * f, c * f, p.x, p.y); fx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); }
    else { fx.setTransform(1, 0, 0, 1, 0, 0); const r = p.size * (1 - t * 0.5); fx.fillRect(p.x - r, p.y - r, r * 2, r * 2); }
    parts[w++] = p;
  }
  parts.length = w; fx.setTransform(1, 0, 0, 1, 0, 0); fx.globalAlpha = 1;
  if (w) requestAnimationFrame(fxLoop); else { fxOn = false; fx.clearRect(0, 0, fxW, fxH); }
}
const confetto = (x, y, vx, vy, g) => fxAdd({ kind: 0, x, y, vx, vy, g, drag: 1.8, rot: rand(0, 6), vr: rand(-8, 8), sway: rand(10, 50), swayF: rand(2, 5), phase: rand(0, 6), flipF: rand(5, 12), size: rand(8, 14), color: pickOne(PAL), max: rand(3.5, 5.5) });
function sparkBurst(x, y, pal = PAL, n = 34) { for (let i = 0; i < n; i++) { const a = rand(0, 6.28), v = rand(90, 320); fxAdd({ kind: 1, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 170, drag: 1.3, max: rand(0.8, 1.4), size: rand(1.8, 3.2), color: pickOne(pal) }); } }
function miniBurst(x, y) { for (let i = 0; i < 26; i++) confetto(x, y, rand(-260, 260), rand(-520, -220), 520); }
function celebrate() {
  for (let i = 0; i < 55; i++) { const sp = rand(-0.35, 0.35); confetto(0, fxH, Math.sin(0.75 + sp) * rand(500, 1050), -Math.cos(0.75 + sp) * rand(800, 1400), 450); confetto(fxW, fxH, -Math.sin(0.75 + sp) * rand(500, 1050), -Math.cos(0.75 + sp) * rand(800, 1400), 450); }
  const end = performance.now() + 3500;
  const rain = setInterval(() => { if (performance.now() > end) return clearInterval(rain); for (let i = 0; i < 3; i++) confetto(rand(0, fxW), -15, rand(-40, 40), rand(40, 160), 420); }, 100);
  [400, 1100, 1900].forEach(d => setTimeout(() => sparkBurst(rand(fxW * 0.15, fxW * 0.85), rand(fxH * 0.1, fxH * 0.4)), d));
}
